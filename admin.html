                        <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z"/>
                    </svg>

                        </div>

                    </div>

                    <!-- Right column: Inputs -->
                    <div class="form-fields-wrapper">
                        <div class="admin-form-group">
                            <label class="form-label" for="game-title-input">Title</label>
                            <input type="text" id="game-title-input" class="admin-form-input" placeholder="Title..." required>
                        </div>
                        
                        <div class="admin-form-group">
                            <label class="form-label" for="game-description-input">Description</label>
                            <textarea id="game-description-input" class="admin-form-textarea" placeholder="Description..." required></textarea>
                        </div>

                            </div>
                        </div>

                            <button type="submit" class="btn-form-save">Save</button>

                    </div>

                    </div>

                        <button type="submit" id="btn-code-submit" class="btn-form-save">Add</button>
                    </div>
                </div>
            </form>
        </div>

                        <button type="button" class="btn-form-cancel" onclick="cancelGiveForm()">Cancel</button>
                        <button type="submit" class="btn-form-save">Give</button>
                    </div>

        // ================= GENERAL NAV TABS INTERACTION =================
        function switchAdminTab(tabName) {
            previousAdminTab = tabName;
            
            // Hide all subviews
            document.querySelectorAll('.admin-subview').forEach(view => {
                view.classList.remove('active');
            });
            // Deactivate all tab elements
            document.querySelectorAll('.admin-nav-item').forEach(tab => {
                tab.classList.remove('active');
            });

            // Activate tab and view container
            document.getElementById(`tab-${tabName}-btn`).classList.add('active');
            document.getElementById(`view-${tabName}`).classList.add('active');

            // Specific tab initializers / dynamic list re-rendering
            if (tabName === 'sales') {
                setTimeout(initSalesChart, 100);
            } else if (tabName === 'games') {
                renderGamesList();
            } else if (tabName === 'users') {
                renderUsersList();
            } else if (tabName === 'codes') {
                renderCodesList();
            }
        }


        // ================= SALES CHART MODULE =================
        function initSalesChart() {
            const ctx = document.getElementById('salesChartCanvas').getContext('2d');
            
            // Clean up previous chart instance
            if (salesChartInstance) {
                salesChartInstance.destroy();
            }

            // Simulated sales timeline labels & values
            const labels = ['June 15', 'June 16', 'June 17', 'June 18', 'June 19', 'June 20', 'June 21', 'June 22'];
            let data = [];

            if (currentChartMetric === 'sales') {
                data = [0, 120, 100, 90, 240, 50, 150, 280]; // Image 2 shape simulation
            } else if (currentChartMetric === 'price') {
                data = [80, 85, 80, 95, 99, 105, 95, 110];
            } else if (currentChartMetric === 'gifts') {
                data = [5, 12, 10, 8, 20, 4, 15, 25];
            } else if (currentChartMetric === 'returns') {
                data = [1, 3, 2, 0, 4, 1, 2, 5];
            }

            // Search filter impact on metrics
            const filterVal = document.getElementById('sales-search').value.toLowerCase();
            if (filterVal) {
                // scale down values to simulate filtering the dataset
                data = data.map(v => Math.round(v * 0.45));
            }

            // Create linear gradient background
            const fillGrad = ctx.createLinearGradient(0, 0, 0, 300);
            fillGrad.addColorStop(0, 'rgba(254, 163, 2, 0.25)');
            fillGrad.addColorStop(1, 'rgba(254, 163, 2, 0.0)');

            salesChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: currentChartMetric.toUpperCase(),
                        data: data,
                        borderColor: '#fea302',
                        borderWidth: 3,
                        backgroundColor: fillGrad,
                        fill: true,
                        tension: 0.1,
                        pointBackgroundColor: '#fea302',
                        pointBorderColor: '#0c121e',
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                                drawTicks: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { family: 'Anta', size: 12 }
                            },
                            border: { dash: [4, 4] }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {

                localStorage.setItem('redeem_codes', JSON.stringify(filteredCodes));

        function saveGame(event) {
            event.preventDefault();
            const title = document.getElementById('game-title-input').value;
            const desc = document.getElementById('game-description-input').value;
            const genre = document.getElementById('game-genre-input').value;
            const developer = document.getElementById('game-developer-input').value;
            let price = document.getElementById('game-price-input').value.trim();
            const installer = document.getElementById('game-installer-input').value;

            // Automatically format price value
            if (price !== '') {
                if (!isNaN(price)) {
                    price = parseFloat(price).toFixed(2) + ' UAH';
                } else if (!price.toUpperCase().endsWith('UAH')) {
                    price = price + ' UAH';
                }
            }

            const games = getGames();

            if (editingGameId === null) {
                // ADD GAME
                const gameId = title.toLowerCase().replace(/[^a-z0-9]/g, '_');
                
                // Duplicate check
                if (games.some(g => g.id === gameId)) {
                    alert("A game with this title already exists!");
                    return;
                }

                const newGame = {
                    id: gameId,
                    title: title,
                    genre: genre,
                    image: selectedFormThumbnailData || 'IMG/Logo.png',
                    link: `${gameId}.html`, // mockup details page link
                    description: desc,
                    developer: developer,
                    price: price,
                    installer: installer,
                    blacklisted: false
                };
                
                games.push(newGame);
            } else {
                // EDIT GAME
                const idx = games.findIndex(g => g.id === editingGameId);
                if (idx !== -1) {
                    games[idx].title = title;
                    games[idx].description = desc;
                    games[idx].genre = genre;
                    games[idx].developer = developer;
                    games[idx].price = price;
                    games[idx].installer = installer;
                    games[idx].image = selectedFormThumbnailData || games[idx].image;
                }
            }

            saveGames(games);
            renderGamesList();
            showSubview('games');
        }

        function maskEmailAddress(email) {
            if (!email) return '';
            const parts = email.split('@');
            if (parts.length !== 2) return email;
            const prefix = parts[0];
            const domain = parts[1];
            if (prefix.length <= 1) return email;
            
            // Mask all characters except the first
            const maskedPrefix = prefix[0] + '*'.repeat(19); // Match design email mask length
            return `${maskedPrefix}@${domain}`;
        }

            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let segment1 = '';
            let segment2 = '';
            let segment3 = '';
            
            for (let i = 0; i < 4; i++) {
                segment1 += chars.charAt(Math.floor(Math.random() * chars.length));
                segment2 += chars.charAt(Math.floor(Math.random() * chars.length));
                segment3 += chars.charAt(Math.floor(Math.random() * chars.length));

            const randomCode = `${segment1}-${segment2}-${segment3}`;

        // User lookup auto suggest
        function searchUsersForGive() {
            const query = document.getElementById('give-user-search').value.toLowerCase();
            const overlay = document.getElementById('give-user-results');
            const users = getUsers();

            // Clear selection and hide preview when user edits query
            giveSelectedUserId = null;
            document.getElementById('give-user-preview').classList.add('d-none');

            if (!query) {
                overlay.classList.remove('active');
                return;
            }

            const filtered = users.filter(u => u.username.toLowerCase().includes(query) || u.email.toLowerCase().includes(query));
            if (filtered.length === 0) {
                overlay.classList.remove('active');
                return;
            }

            let html = '';
            filtered.forEach(u => {
                html += `<div class="overlay-item" onclick="selectGiveUser('${u.id}')">${u.username} (${u.email})</div>`;
            });
            overlay.innerHTML = html;
            overlay.classList.add('active');
        }

        function selectGiveUser(userId) {
            giveSelectedUserId = parseInt(userId);
            document.getElementById('give-user-results').classList.remove('active');

            const users = getUsers();
            const user = users.find(u => u.id === giveSelectedUserId);
            if (user) {
                document.getElementById('give-user-search').value = user.username;
                const preview = document.getElementById('give-user-preview');
                preview.innerHTML = `
                    <div class="d-flex align-items-center gap-3">
                        <img src="${user.avatar || 'Img/Avatar.jpg'}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;" alt="${user.username}">
                        <div>
                            <h5 class="m-0" style="font-weight: 700;">${user.username}</h5>
                            <p class="m-0 text-secondary">${maskEmailAddress(user.email)}</p>
                        </div>
                    </div>
                `;
                preview.classList.remove('d-none');
            }
        }

        function submitGiveLicense(event) {
            event.preventDefault();

            if (!giveSelectedGameId || !giveSelectedUserId) {
                alert("Please select both a game and a user.");
                return;
            }

            const users = getUsers();
            const userIdx = users.findIndex(u => u.id === giveSelectedUserId);
            
            if (userIdx !== -1) {
                // Check if user already owns game
                if (users[userIdx].games.includes(giveSelectedGameId)) {
                    alert("This user already owns this game!");
                    return;
                }

                // Add to user inventory
                users[userIdx].games.push(giveSelectedGameId);
                saveUsers(users);

                // If user is currently logged in, sync with localStorage ownedGames
                const currentUsername = localStorage.getItem('username');
                if (users[userIdx].username === currentUsername) {
                    const games = getGames();
                    const game = games.find(g => g.id === giveSelectedGameId);
                    if (game) {
                        const ownedGames = JSON.parse(localStorage.getItem('ownedGames') || '[]');
                        // check if already in ownedGames
                        if (!ownedGames.some(og => og.id === game.id)) {
                            ownedGames.push({
                                id: game.id,
                                title: game.title,
                                genre: game.genre,
                                image: game.image,
                                link: game.link,
                                description: game.description,
                                developer: game.developer,
                                price: 'Owned'
                            });
                            localStorage.setItem('ownedGames', JSON.stringify(ownedGames));
                        }
                    }
                }

                alert("Game license given successfully!");
                renderUsersList();
                renderGamesList();
                
                // Return to previous active tab (users or games)
                showSubview(previousAdminTab);
            }
        }

        function cancelGiveForm() {
            showSubview(previousAdminTab);
        }


        // ================= HELPER SUBVIEW NAVIGATION =================
        function showSubview(subviewId) {
            // Hide all subviews
            document.querySelectorAll('.admin-subview').forEach(view => {
                view.classList.remove('active');
            });
            // Show target
            if (subviewId === 'sales' || subviewId === 'games' || subviewId === 'users' || subviewId === 'codes') {
                // Main tab switching
                switchAdminTab(subviewId);
            } else {
                // Overlay forms
                document.getElementById(`view-${subviewId}`).classList.add('active');
            }
        }
    </script>
</body>
