<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStop - Your Ultimate Computer Game Store</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anta&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Style -->
    <link href="Style/style_catalog.css" rel="stylesheet">

    <link rel="shortcut icon" href="Img/Logo.ico" type="image/x-icon">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container-fluid px-4 px-lg-5">
            <a class="navbar-brand" href="landing.html">
                <img class="nav-logo" src="Img/Logo.png" alt="GameStop Logo">
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="catalog.html">Catalog</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="inventory.html">Inventory</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="service.html">Service</a>
                    </li>
                    <li class="nav-item dropdown ms-lg-4 mt-3 mt-lg-0">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="Img/Avatar.jpg" alt="Profile" class="profile-pic me-2">
                            <span class="d-lg-none">My Account</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="redeem.html">Redeem Code</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="#">Log out</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <!--Searchbar and recent searches-->
        <section class="search">
            <form class="d-flex" role="search">
                <input class="form-control me-2" id="catalog-search-input" type="search" placeholder="What are you looking for?"
                    aria-label="Search" />
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <div class="recent-searches">
                <h2 class="title">Recent searches</h2>
                <div class="game-search-grid">
                    <a href="CS_2.html">
                        <div class="game-card">
                            <img src="/IMG/CS_2.jpg" alt="Counter-Strike 2">
                            <div class="info">
                                <h3>Counter-Strike 2</h3>
                            </div>
                        </div>
                    </a>
                    <a href="Pubg.html">
                        <div class="game-card">
                            <img src="/IMG/Pubg.jpg" alt="PUBG Battlegrounds">
                            <div class="info">
                                <h3>PUBG Battlegrounds</h3>
                            </div>
                        </div>
                    </a>
                    <a href="ADOFAI.html">
                        <div class="game-card">
                            <img src="/IMG/ADOFAI.jpg" alt="A Dance of Fire and Ice">
                            <div class="info">
                                <h3>A Dance of Fire and Ice</h3>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </section>
        <!--Search results-->
        <section class="search-results">
            <div class="search-results-grid" id="catalog-grid">
                <!-- Loaded dynamically via JavaScript -->
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-nav">
                <a href="landing.html">Home</a>
                <a href="catalog.html">Catalog</a>
                <a href="service.html">Customer Service</a>
                <a href="inventory.html">Inventory</a>
            </div>
            <div class="copyright">
                <div class="logo">
                    <img src="Img/Logo.png" alt="GameStop Logo">
                </div>
                <div class="copyright-text">© 2026 GameStop. All rights reserved.</div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Script/navbar.js"></script>
    <script>
        const defaultGamesList = [
            {
                id: 'adofai',
                title: 'A Dance of Fire and Ice',
                genre: 'Rhythm',
                image: 'IMG/ADOFAI.jpg',
                link: 'ADOFAI.html',
                description: 'A Dance of Fire and Ice is a strict rhythm game. Keep your focus as you guide two orbiting planets along a winding path without breaking their perfect equilibrium.',
                developer: '7th Beat Games',
                price: '119.99 UAH',
                blacklisted: false
            },
            {
                id: 'gd',
                title: 'Geometry Dash',
                genre: 'Rhythm',
                image: 'IMG/GD.jpg',
                link: 'GD.html',
                description: 'Jump and fly your way through danger in this rhythm-based action platformer!',
                developer: 'RobTop Games',
                price: '124.99 UAH',
                blacklisted: false
            },
            {
                id: 'muse_dash',
                title: 'Muse Dash',
                genre: 'Rhythm',
                image: 'IMG/Muse_Dash.jpg',
                link: 'Muse_Dash.html',
                description: 'Paradise of parkour & rhythm game — Muse Dash!!',
                developer: 'PeroPeroGames',
                price: '22.00 UAH',
                blacklisted: false
            },
            {
                id: 'cs_2',
                title: 'Counter-Strike 2',
                genre: 'FPS',
                image: 'IMG/CS_2.jpg',
                link: 'CS_2.html',
                description: 'For over two decades, Counter-Strike has offered an elite competitive experience, one shaped by millions of players from across the globe. And now the next chapter in the CS saga is about to begin. This is Counter-Strike 2.',
                developer: 'Valve',
                price: '49.99 UAH',
                blacklisted: false
            },
            {
                id: 'pubg',
                title: 'PUBG Battlegrounds',
                genre: 'FPS',
                image: 'IMG/Pubg.jpg',
                link: 'Pubg.html',
                description: 'Land on strategic locations, loot weapons and supplies, and survive to become the last team standing in various, diverse Battlegrounds.',
                developer: 'Krafton',
                price: '39.99 UAH',
                blacklisted: false
            },
            {
                id: 'fortnite',
                title: 'Fortnite',
                genre: 'Shooter',
                image: 'IMG/Fortnite.jpg',
                link: 'Fortnite.html',
                description: 'Create, play, and battle with friends for free in Fortnite. Be the last player standing in Battle Royale and Zero Build, experience a concert or live event, or discover over a million creator-made games.',
                developer: 'Epic Games',
                price: '29.99 UAH',
                blacklisted: false
            },
            {
                id: 'halo',
                title: 'Halo Infinite',
                genre: 'FPS',
                image: 'IMG/Halo.jpg',
                link: 'Halo.html',
                description: 'The legendary shooter series returns with the most expansive Master Chief campaign yet and a groundbreaking free-to-play multiplayer experience.',
                developer: '343 Industries',
                price: '99.99 UAH',
                blacklisted: false
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize games if empty
            if (!localStorage.getItem('games')) {
                localStorage.setItem('games', JSON.stringify(defaultGamesList));
            }
            
            // Initial load
            loadCatalogGames();

            // Search form interception
            const searchForm = document.querySelector('form[role="search"]');
            if (searchForm) {
                searchForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    loadCatalogGames();
                });
            }
        });

        function loadCatalogGames() {
            const grid = document.getElementById('catalog-grid');
            if (!grid) return;

            const games = JSON.parse(localStorage.getItem('games') || '[]');
            const searchInput = document.getElementById('catalog-search-input');
            const query = searchInput ? searchInput.value.toLowerCase() : '';

            // Filter out blacklisted games, and filter by query
            const filtered = games.filter(g => 
                !g.blacklisted && 
                (g.title.toLowerCase().includes(query) || g.genre.toLowerCase().includes(query) || g.description.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="text-center py-5 w-100">
                        <p class="text-secondary fs-5">No games match your search.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(game => {
                html += `
                <div class="search-results-card">
                    <a href="${game.link}">
                        <div class="card mb-3" style="max-width: 1080px; width: 100%;">
                            <div class="row g-0">
                                <div class="col-md-4">
                                    <img src="${game.image}" class="img-fluid rounded-start" alt="${game.title}">
                                </div>
                                <div class="col-md-8">
                                    <div class="card-body">
                                        <h5 class="card-title">${game.title}</h5>
                                        <p class="card-text"><small class="text-body-secondary">${game.price}</small></p>
                                        <p class="card-text">${game.description}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
                `;
            });
            grid.innerHTML = html;
        }
    </script>
</body>

</html>
